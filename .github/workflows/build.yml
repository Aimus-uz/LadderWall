name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: LadderWall
          path: out/LadderWall.dll
